[project]
name = "comfyui-fleet"
version = "0.1.0"
description = "Durable whole-workflow scheduling across stock ComfyUI workers"
requires-python = ">=3.12"
dependencies = ["packaging"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=tests"
